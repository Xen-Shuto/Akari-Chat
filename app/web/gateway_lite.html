<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>あかり Lite</title><style>body{background:#101313;color:#e8eee6;font:16px system-ui;max-width:48rem;margin:auto;padding:1.5rem}label,textarea,input,select,button{display:block;box-sizing:border-box;width:100%;margin:.6rem 0;padding:.7rem}textarea{min-height:6rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}</style><h1>あかり Lite</h1><p>トークンはこの画面のメモリだけに保持します。ページを閉じると再入力が必要です。</p><label>接続トークン<input id="token" type="password" autocomplete="off"></label><button id="connect">ルーム一覧を取得</button><label>ルーム<select id="rooms"></select></label><button id="history">直近の会話を読む</button><pre id="log"></pre><label>メッセージ<textarea id="message" maxlength="100000"></textarea></label><button id="send">送信</button><button id="cancel">生成を中止</button><p id="status" role="status"></p><script src="/lite.js"></script></html>
